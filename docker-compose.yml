services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keitaro
      POSTGRES_PASSWORD: keitaro
      POSTGRES_DB: keitaro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keitaro"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://keitaro:keitaro@db:5432/keitaro
      GOOGLE_REDIRECT_URL: https://www.google.com
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
