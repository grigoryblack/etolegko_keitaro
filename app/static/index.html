<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Keitaro Campaign Manager</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
  header { background: #1f2937; color: #fff; padding: 14px 24px; font-size: 18px; font-weight: 600; }
  .tabs { display: flex; gap: 4px; padding: 12px 24px 0; }
  .tabs button { padding: 8px 16px; border: 1px solid #d1d5db; border-bottom: none; background: #e5e7eb; cursor: pointer; border-radius: 6px 6px 0 0; }
  .tabs button.active { background: #fff; font-weight: 600; }
  main { margin: 0 24px 24px; background: #fff; border: 1px solid #d1d5db; border-radius: 0 6px 6px 6px; padding: 24px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  label { display: block; margin: 12px 0 4px; font-size: 13px; font-weight: 600; }
  input, select { padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px; min-width: 260px; font-size: 14px; }
  button.action { padding: 9px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button.action:hover { background: #1d4ed8; }
  button.action:disabled { background: #9ca3af; cursor: default; }
  button.danger { background: #dc2626; }
  button.danger:hover { background: #b91c1c; }
  button.small { padding: 4px 10px; font-size: 13px; }
  button.ghost { background: #6b7280; }
  button.ghost:hover { background: #4b5563; }
  button.pin { background: #f59e0b; }
  button.pin.on { background: #d97706; box-shadow: inset 0 0 0 2px #92400e; }
  table { border-collapse: collapse; margin-top: 12px; width: 100%; }
  th, td { border: 1px solid #e5e7eb; padding: 8px 10px; text-align: left; font-size: 14px; }
  th { background: #f9fafb; }
  .msg { margin-top: 14px; padding: 10px 14px; border-radius: 6px; font-size: 14px; display: none; white-space: pre-wrap; }
  .msg.ok { display: block; background: #dcfce7; color: #166534; }
  .msg.err { display: block; background: #fee2e2; color: #991b1b; }
  .stream { border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-top: 16px; background: #fff; }
  .stream.dirty { background: #fef9c3; border-color: #facc15; }
  .stream h3 { margin: 0 0 4px; font-size: 15px; display: inline-block; }
  .muted { color: #6b7280; font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  tr.removed td { background: #f3f4f6; color: #6b7280; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 8px; vertical-align: middle; }
  .badge.dirty { background: #facc15; color: #713f12; }
  .badge.removed { background: #9ca3af; color: #fff; }
  .toolbar { float: right; }
  .toolbar button { margin-left: 6px; }
  .share { font-variant-numeric: tabular-nums; font-weight: 600; }
</style>
</head>
<body>
<header>Keitaro Campaign Manager</header>
<div class="tabs">
  <button id="tab-create" class="active" onclick="switchTab('create')">Создать кампанию</button>
  <button id="tab-edit" onclick="switchTab('edit')">Редактор офферов</button>
</div>
<main>
  <!-- Part 1: creator -->
  <section id="panel-create" class="tab-panel active">
    <label>Название кампании</label>
    <input id="c-name" placeholder="My campaign">
    <label>Гео (ISO alpha-2, например RU)</label>
    <input id="c-geo" maxlength="2" placeholder="RU" style="min-width:80px">
    <label>Оффер</label>
    <select id="c-offer"></select>
    <label>Домен</label>
    <select id="c-domain"></select>
    <label>Группа</label>
    <select id="c-group"></select>
    <label>Источник трафика</label>
    <select id="c-source"></select>
    <br>
    <button class="action" style="margin-top:16px" onclick="createCampaign()">Создать кампанию</button>
    <div id="c-msg" class="msg"></div>
  </section>

  <!-- Part 2: staged offers editor -->
  <section id="panel-edit" class="tab-panel">
    <div class="row">
      <div>
        <label>Кампания</label>
        <select id="e-campaign" onchange="loadLocalStreams()"></select>
      </div>
      <button class="action" onclick="fetchStreams()">Fetch streams again</button>
    </div>
    <div id="e-streams"></div>
    <div id="e-msg" class="msg"></div>
  </section>
</main>

<script>
const api = async (path, opts = {}) => {
  const res = await fetch('/api' + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const detail = data && data.detail ? JSON.stringify(data.detail) : res.statusText;
    throw new Error(detail);
  }
  return data;
};

let offersCache = [];

function switchTab(tab) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
  if (tab === 'edit') loadCampaigns();
}

function fillSelect(el, items, { valueKey = 'id', labelKey = 'name', emptyLabel = null } = {}) {
  el.innerHTML = '';
  if (emptyLabel !== null) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = emptyLabel;
    el.appendChild(opt);
  }
  (items || []).forEach(item => {
    const opt = document.createElement('option');
    opt.value = item[valueKey];
    opt.textContent = `#${item[valueKey]} — ${item[labelKey]}`;
    el.appendChild(opt);
  });
}

function showMsg(id, text, ok) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}

async function loadRefs() {
  try {
    const [offers, domains, groups, sources] = await Promise.all([
      api('/offers'), api('/domains'), api('/groups'), api('/sources'),
    ]);
    offersCache = offers || [];
    fillSelect(document.getElementById('c-offer'), offersCache);
    fillSelect(document.getElementById('c-domain'), domains, { emptyLabel: '— не выбран —' });
    fillSelect(document.getElementById('c-group'), groups, { emptyLabel: '— не выбрана —' });
    fillSelect(document.getElementById('c-source'), sources, { emptyLabel: '— не выбран —' });
  } catch (e) {
    showMsg('c-msg', 'Не удалось загрузить данные из Keitaro: ' + e.message, false);
  }
}

async function createCampaign() {
  const payload = {
    name: document.getElementById('c-name').value.trim(),
    geo: document.getElementById('c-geo').value.trim().toUpperCase(),
    offer_id: parseInt(document.getElementById('c-offer').value, 10),
  };
  for (const [id, key] of [['c-domain', 'domain_id'], ['c-group', 'group_id'], ['c-source', 'source_id']]) {
    const v = document.getElementById(id).value;
    if (v) payload[key] = parseInt(v, 10);
  }
  if (!payload.name || payload.geo.length !== 2 || !payload.offer_id) {
    showMsg('c-msg', 'Заполните название, гео (2 буквы) и выберите оффер', false);
    return;
  }
  try {
    const res = await api('/campaigns', { method: 'POST', body: JSON.stringify(payload) });
    showMsg('c-msg', `Кампания создана! Keitaro ID: ${res.campaign.id}, потоки: ${res.streams.map(s => s.id).join(', ')}`, true);
  } catch (e) {
    showMsg('c-msg', 'Ошибка: ' + e.message, false);
  }
}

// ---------- part 2: editor ----------

async function loadCampaigns() {
  try {
    const campaigns = await api('/campaigns');
    fillSelect(document.getElementById('e-campaign'), campaigns, { emptyLabel: '— выберите кампанию —' });
    document.getElementById('e-streams').innerHTML = '';
  } catch (e) {
    showMsg('e-msg', 'Не удалось загрузить кампании: ' + e.message, false);
  }
}

function selectedCampaign() {
  return document.getElementById('e-campaign').value;
}

async function fetchStreams() {
  const cid = selectedCampaign();
  if (!cid) { showMsg('e-msg', 'Выберите кампанию', false); return; }
  try {
    const streams = await api(`/campaigns/${cid}/fetch_streams`, { method: 'POST' });
    renderStreams(streams);
    showMsg('e-msg', 'Потоки синхронизированы с Keitaro', true);
  } catch (e) {
    showMsg('e-msg', 'Ошибка: ' + e.message, false);
  }
}

async function loadLocalStreams() {
  const cid = selectedCampaign();
  const container = document.getElementById('e-streams');
  container.innerHTML = '';
  if (!cid) return;
  try {
    const streams = await api(`/campaigns/${cid}/streams`);
    if (streams.length) renderStreams(streams);
    else container.innerHTML = '<p class="muted">Нажмите «Fetch streams again», чтобы загрузить потоки из Keitaro</p>';
  } catch (e) {
    showMsg('e-msg', 'Ошибка: ' + e.message, false);
  }
}

function renderStreams(streams) {
  const container = document.getElementById('e-streams');
  container.innerHTML = '';
  streams.forEach(s => container.appendChild(renderStream(s)));
}

function offerLabel(o) {
  return o.offer_name ? `#${o.offer_id} — ${o.offer_name}` : `#${o.offer_id}`;
}

function renderStream(s) {
  const div = document.createElement('div');
  div.className = 'stream' + (s.dirty ? ' dirty' : '');

  const toolbar = `<span class="toolbar">
      <button class="action small" data-push ${s.dirty ? '' : 'disabled'}>Push to KTM</button>
      <button class="action small ghost" data-cancel ${s.dirty ? '' : 'disabled'}>Cancel</button>
    </span>`;
  div.innerHTML = `<h3>#${s.keitaro_id} — ${s.name}</h3>
    ${s.dirty ? '<span class="badge dirty">unpublished</span>' : ''}${toolbar}
    <div class="muted">тип: ${s.type || '—'} · схема: ${s.schema || '—'} · состояние: ${s.state || '—'}</div>`;

  const active = s.offers.filter(o => o.status === 'active');
  const removed = s.offers.filter(o => o.status === 'removed');

  const table = document.createElement('table');
  table.innerHTML = '<tr><th>Оффер</th><th>Вес</th><th>Pin</th><th></th></tr>';
  if (!active.length && !removed.length) {
    table.innerHTML += '<tr><td colspan="4" class="muted">Поток без офферов</td></tr>';
  }
  active.forEach(o => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${offerLabel(o)}</td>
      <td class="share">${o.share}%</td>
      <td><button class="action small pin ${o.pinned ? 'on' : ''}" data-pin>${o.pinned ? '📌' : 'Pin'}</button></td>
      <td><button class="action small danger" data-del>Remove</button></td>`;
    tr.querySelector('[data-pin]').onclick = () => streamAction(s.id, `/offers/${o.offer_id}/pin`);
    tr.querySelector('[data-del]').onclick = () => streamAction(s.id, `/offers/${o.offer_id}/remove`);
    table.appendChild(tr);
  });
  removed.forEach(o => {
    const tr = document.createElement('tr');
    tr.className = 'removed';
    tr.innerHTML = `<td>${offerLabel(o)} <span class="badge removed">Removed</span></td>
      <td class="share">${o.share}%</td><td></td>
      <td><button class="action small" data-back>Bring back</button></td>`;
    tr.querySelector('[data-back]').onclick = () => streamAction(s.id, `/offers/${o.offer_id}/restore`);
    table.appendChild(tr);
  });
  div.appendChild(table);

  // add-offer row with autocomplete
  const row = document.createElement('div');
  row.className = 'row';
  const dlId = `dl-${s.id}`;
  row.innerHTML = `<input list="${dlId}" placeholder="ID или название оффера" style="min-width:300px">
    <datalist id="${dlId}"></datalist>
    <button class="action small" data-add>Add offer</button>`;
  const input = row.querySelector('input');
  const datalist = row.querySelector('datalist');
  input.oninput = async () => {
    if (input.value.trim().length < 1) return;
    try {
      const found = await api(`/offers/search?query=${encodeURIComponent(input.value.trim())}`);
      datalist.innerHTML = '';
      (found || []).slice(0, 20).forEach(o => {
        const opt = document.createElement('option');
        opt.value = String(o.id);
        opt.label = o.name;
        datalist.appendChild(opt);
      });
    } catch (e) { /* ignore autocomplete errors */ }
  };
  row.querySelector('[data-add]').onclick = () => {
    const id = parseInt(input.value.trim(), 10);
    if (!id) { showMsg('e-msg', 'Введите ID оффера', false); return; }
    streamAction(s.id, '/offers', { offer_id: id });
  };
  div.appendChild(row);

  div.querySelector('[data-push]').onclick = () => streamAction(s.id, '/push', null, 'Изменения опубликованы в Keitaro');
  div.querySelector('[data-cancel]').onclick = () => streamAction(s.id, '/cancel', null, 'Изменения отменены');
  return div;
}

async function streamAction(streamId, suffix, body, okText) {
  try {
    const stream = await api(`/streams/${streamId}${suffix}`, {
      method: 'POST',
      body: body ? JSON.stringify(body) : undefined,
    });
    const container = document.getElementById('e-streams');
    const old = Array.from(container.children).find(
      el => el.querySelector('h3') && el.querySelector('h3').textContent.includes(`#${stream.keitaro_id} `)
    );
    const fresh = renderStream(stream);
    if (old) container.replaceChild(fresh, old); else container.appendChild(fresh);
    if (okText) showMsg('e-msg', okText, true); else document.getElementById('e-msg').className = 'msg';
  } catch (e) {
    showMsg('e-msg', 'Ошибка: ' + e.message, false);
  }
}

loadRefs();
</script>
</body>
</html>
